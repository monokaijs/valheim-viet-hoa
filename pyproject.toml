[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "valheim-vn"
version = "0.1.0"
description = "Context-aware Vietnamese localization pipeline for Valheim"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openai>=1.99.0",
  "pydantic>=2.11.0",
  "UnityPy>=1.23.0",
]

[project.optional-dependencies]
dev = ["fonttools>=4.63.0", "pytest>=8.4.0"]

[project.scripts]
valheim-vn = "valheim_vn.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/valheim_vn"]

[tool.pytest.ini_options]
testpaths = ["tests"]

